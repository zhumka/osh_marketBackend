spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/osh_market}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:osh-market}

jwt:
  secret: ${JWT_SECRET:c2VjcmV0a2V5Zm9yb3NobWFya2V0bWFuYWdlbWVudHN5c3RlbTIwMjY=}
  expiration-ms: 28800000  # 8 hours

app:
  seed:
    # Наполнение БД тестовыми данными при старте (идемпотентно).
    # В проде выставить false (env: APP_SEED_ENABLED=false).
    enabled: ${APP_SEED_ENABLED:true}
  password-reset:
    code-expiration-minutes: 15
    token-expiration-minutes: 15
  rate-limit:
    max-attempts: 5
    lockout-minutes: 15
  from-email: ${MAIL_FROM:noreply@oshmarket.kg}
  from-name: "Ошский Рынок"
  sms:
    enabled: ${SMS_ENABLED:false}

logging:
  level:
    com.oshmarket: DEBUG
